name: Supabase Migrations

# Runs migrations on the production database whenever code lands on main,
# BEFORE the Vercel deploy serves new code that depends on the new schema.
#
# Applies each migration via the Supabase MANAGEMENT API query endpoint
# (scripts/supabase-migrate.sh) — no DB connection / pooler / password, and
# no `supabase link` (avoids supabase/cli#6115 SchemaError in v2.112.0).
# Migrations are idempotent, so replays of applied ones are safe no-ops.

on:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migrations via Management API
        run: bash scripts/supabase-migrate.sh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
