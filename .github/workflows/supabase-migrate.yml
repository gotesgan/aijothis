name: Supabase Migrations

# Runs migrations on the production database whenever code lands on main,
# BEFORE the Vercel deploy serves new code that depends on the new schema.
#
# Uses a direct --db-url (built from SUPABASE_PROJECT_REF + SUPABASE_DB_PASSWORD)
# instead of `supabase link`, which currently hits an open CLI bug
# (supabase/cli#6115: SchemaError on api-keys inserted_at in v2.112.0).

on:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations
        run: |
          PW=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$SUPABASE_DB_PASSWORD")
          supabase db push \
            --db-url "postgresql://postgres.${SUPABASE_PROJECT_REF}:${PW}@db.${SUPABASE_PROJECT_REF}.supabase.co:5432/postgres"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
