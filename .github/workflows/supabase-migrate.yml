name: Supabase Migrations

# Runs migrations on the production database whenever code lands on main,
# BEFORE the Vercel deploy serves new code that depends on the new schema.
#
# - Uses --db-url (NOT `supabase link`) to dodge supabase/cli#6115
#   (SchemaError on api-keys inserted_at in v2.112.0).
# - Connects through the project-specific TRANSACTION POOLER
#   (<ref>.pooler.supabase.com:5432). Newer Supabase projects use this
#   per-project pooler host; the shared aws-0-<region> host returns
#   "tenant/user not found" for them. The direct db.<ref>.supabase.co host
#   is IPv6-only (unreachable from GitHub Actions runners).

on:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations
        run: |
          PW=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$SUPABASE_DB_PASSWORD")
          supabase db push \
            --db-url "postgresql://postgres.${SUPABASE_PROJECT_REF}:${PW}@${SUPABASE_PROJECT_REF}.pooler.supabase.com:5432/postgres"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
