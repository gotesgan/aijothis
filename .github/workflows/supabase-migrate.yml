name: Supabase Migrations

# Runs migrations on the production database whenever code lands on main,
# BEFORE the Vercel deploy serves new code that depends on the new schema.
#
# Applies each migration file via the Supabase MANAGEMENT API query endpoint
# (POST /v1/projects/<ref>/database/query) — no DB connection, no pooler, no
# password, and it dodges supabase/cli#6115 (supabase link SchemaError).
#
# All migrations are idempotent (IF NOT EXISTS), so replaying already-applied
# ones (0001/0003) is a safe no-op; 0004/0005 apply for real on first run.

on:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migrations via Management API
        run: |
          set -e
          for f in supabase/migrations/*.sql; do
            echo "::group::Applying $f"
            python3 -c "
import json, sys
sql = open('$f').read()
print(json.dumps({'query': sql}))
" > /tmp/payload.json
            curl -sS -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -d @/tmp/payload.json
            echo
            echo "::endgroup::"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
